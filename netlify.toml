# Netlify detects Next.js and applies its Next.js runtime automatically.
# Set NEXT_PUBLIC_API_URL and NEXT_PUBLIC_SITE_URL in Site settings -> Environment
# variables before the first build — the /api rewrite in next.config.ts is
# resolved at build time.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
